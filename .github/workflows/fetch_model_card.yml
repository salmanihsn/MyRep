name: Fetch Full Model Card

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: 'Hugging Face Model ID (e.g., SulphurAI/Sulphur-2-base)'
        required: true
        default: 'SulphurAI/Sulphur-2-base'

permissions:
  contents: write

jobs:
  fetch-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Fetch model card
        run: python fetch_card.py "${{ github.event.inputs.model_id }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model_card.md
          git commit -m "Add model card for ${{ github.event.inputs.model_id }}" || echo "No changes"
          git push
