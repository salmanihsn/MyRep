name: Fetch Hugging Face Model Descriptions

on:
  workflow_dispatch:

jobs:
  fetch-descriptions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Fetch models and descriptions
        run: python fetch_descriptions.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: model-descriptions
          path: models.txt
