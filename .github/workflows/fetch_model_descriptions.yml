name: Fetch Hugging Face Model Descriptions

on:
  workflow_dispatch:

permissions:
  contents: write   # needed to push commits

jobs:
  fetch-descriptions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true   # ensures the token is used for later push

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Fetch models and descriptions
        run: python fetch_descriptions.py

      - name: Commit and push models.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models.txt
          git commit -m "Update models.txt with latest model descriptions" || echo "No changes to commit"
          git push
