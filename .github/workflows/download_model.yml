name: Download Hugging Face Model

on:
  workflow_dispatch: # This allows you to manually trigger the action
    inputs:
      model_id:
        description: 'Hugging Face Model ID (e.g., google-bert/bert-base-uncased)'
        required: true
        default: 'google-bert/bert-base-uncased'

jobs:
  download-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Hugging Face Hub
        run: pip install huggingface-hub

      - name: Download Model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }} # Optional: for private models
        run: |
          # Download the full model repository
          huggingface-cli download ${{ github.event.inputs.model_id }} --local-dir ./model --local-dir-use-symlinks False

      - name: Upload Model as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hf-model-${{ github.event.inputs.model_id }}
          path: ./model/
          if-no-files-found: error
