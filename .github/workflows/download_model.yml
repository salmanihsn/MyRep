name: Download Hugging Face Model

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: 'Hugging Face Model ID (e.g., google-bert/bert-base-uncased)'
        required: true
        default: ''
        
      file_address:
        description: 'address of filename (e.g., prompt_enhancer/sulphur_prompt_enhancer_model-q8_0.gguf)'
        required: true
        default: ''

jobs:
  download-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install hf (Hugging Face CLI)
        run: |
          pip install --upgrade huggingface-hub
          # 'hf' is now part of huggingface-hub

      - name: Login to Hugging Face (optional, for private models)
        if: ${{ secrets.HF_TOKEN != '' }}
        run: hf auth login --token ${{ secrets.HF_TOKEN }}

      - name: Download single file using hf
        run: |
          mkdir -p ./model/prompt_enhancer
          hf download ${{ github.event.inputs.model_id }} \
          --include "${{ github.event.inputs.file_address }}" \
          --local-dir ./model \
          --local-dir-use-symlinks False

      - name: Upload model as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hf-model-${{ github.event.inputs.model_id }}
          path: ./model/
          if-no-files-found: error
