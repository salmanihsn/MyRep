name: Download Hugging Face Model

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: 'Hugging Face Model ID (e.g., google-bert/bert-base-uncased)'
        required: true
        default: 'google-bert/bert-base-uncased'
      include_snapshots:
        description: 'Download full snapshot (all files)'
        type: boolean
        default: true

jobs:
  download-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install hf (Hugging Face CLI)
        run: |
          pip install --upgrade huggingface-hub
          # 'hf' is now part of huggingface-hub

      - name: Login to Hugging Face (optional, for private models)
        if: ${{ secrets.HF_TOKEN != '' }}
        run: hf auth login --token ${{ secrets.HF_TOKEN }}

      - name: Download model using hf
        run: |
          # Create output directory
          mkdir -p ./model
          
          # Download the full model repository
          # Use --repo-type model (default) and --include "*" for all files
          hf download ${{ github.event.inputs.model_id }} \
            --repo-type model \
            --local-dir ./model \
            --local-dir-use-symlinks False

      - name: Upload model as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hf-model-${{ github.event.inputs.model_id }}
          path: ./model/
          if-no-files-found: error
